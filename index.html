<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';">
    <meta name="referrer" content="no-referrer">
    <title>نِبرا | NIBRA - زخرفة وتوليد الألقاب والبايو</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 25px;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
        }

        .card-text {
            font-size: 1.1rem;
            word-break: break-all;
            flex: 1;
            margin-left: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button.action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.save-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        button.save-btn.saved {
            color: var(--success);
            border-color: var(--success);
        }

        .load-more-container {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .load-more-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .load-more-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 200;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border);
            z-index: 300;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .delete-btn:hover {
            background-color: var(--danger-hover);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 400;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            border: none;
        }

        .btn-confirm {
            background-color: var(--danger);
            color: white;
        }

        .btn-cancel {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            background-color: var(--card-bg);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NIBRA | نِبرا</div>
        <button class="menu-btn" id="menuBtn" aria-label="القائمة الجانبية">☰</button>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="اكتب اسمك (مثال: Vivora) لتوليد ألقاب وزخارف..." maxlength="40" autocomplete="off" spellcheck="false">
        
        <div class="section-title" id="sectionTitle">أسماء نقترحها عليك:</div>
        <div class="grid" id="itemsGrid"></div>

        <div class="load-more-container" id="loadMoreContainer" style="display: none;">
            <button class="load-more-btn" id="loadMoreBtn">عرض المزيد من الزخارف 🪄</button>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h3>الأسماء المحفوظة</h3>
            <button class="close-drawer" id="closeDrawer">&times;</button>
        </div>
        <div class="drawer-body" id="savedItemsContainer"></div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <p>هل أنت متأكد من حذف هذا الاسم من قائمة المحفوظات؟</p>
            <div class="modal-actions">
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">نعم، حذف</button>
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <footer>
        <div>جميع الحقوق محفوظة © نِبرا 2026</div>
    </footer>

    <script>
        // ==================== نظام الحماية ====================
        
        // منع تضمين الصفحة في iframe (حماية إضافية)
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }

        // تنظيف وتعقيم المدخلات بقوة
        function sanitizeInput(str) {
            if (typeof str !== 'string') return '';
            
            let cleaned = str
                // إزالة أي تاجات HTML
                .replace(/<[^>]*>/g, '')
                // إزالة بروتوكولات خطرة
                .replace(/javascript\s*:/gi, '')
                .replace(/vbscript\s*:/gi, '')
                .replace(/data\s*:/gi, '')
                // إزالة معالجات الأحداث
                .replace(/on\w+\s*=/gi, '')
                // إزالة الكيانات HTML
                .replace(/&[#\w]+;/g, '')
                // إزالة الرموز الخطرة
                .replace(/[<>"'`\\]/g, '')
                // إزالة أحرف التحكم
                .replace(/[\u0000-\u001F\u007F-\u009F]/g, '')
                // السماح فقط بالعربية والإنجليزية والأرقام وبعض الرموز الآمنة
                .replace(/[^\u0600-\u06FFa-zA-Z0-9\s\-_.'’]/g, '');
            
            return cleaned.trim().substring(0, 40);
        }

        // تهريب HTML لمنع XSS عند العرض
        function escapeHTML(str) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;',
                '/': '&#x2F;',
                '`': '&#x60;'
            };
            return String(str).replace(/[&<>"'`/]/g, char => map[char] || char);
        }

        // تهريب آمن للاستخدام داخل خاصية onclick (JSON)
        function safeJSONString(str) {
            return JSON.stringify(String(str));
        }

        // ==================== باقي الكود ====================

        const defaultItems = [
            { id: 'd1', text: "𝓝𝓲𝓫𝓻𝓪" },
            { id: 'd2', text: "Ⓝⓘⓑⓡⓐ" },
            { id: 'd3', text: "꧁ঔৣ۝ نِبرا ۝ৣঔ꧂" },
            { id: 'd4', text: "🐻 (ᵔᴥᵔ) NIBRA (ᵔᴥᵔ) 🐻" },
            { id: 'd5', text: "✨ 🐼 NIBRA 🐼 ✨" },
            { id: 'd6', text: "🌸 ☁️ NIBRA ☁️ 🌸" }
        ];

        let savedItems = [];
        try {
            const stored = localStorage.getItem('nibra_saved');
            if (stored) {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    // تنظيف البيانات المخزنة سابقاً
                    savedItems = parsed
                        .filter(item => item && typeof item.text === 'string' && typeof item.id === 'string')
                        .map(item => ({
                            id: sanitizeInput(item.id) || ('s_' + Date.now()),
                            text: String(item.text).substring(0, 200)
                        }));
                }
            }
        } catch (e) {
            savedItems = [];
        }

        let itemToDeleteId = null;
        let visibleCount = 5;
        let currentFullList = [];

        function toCircledFont(str) {
            const normal = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const circled = "ⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏ";
            return str.split('').map(char => {
                const idx = normal.indexOf(char);
                return idx !== -1 ? circled[idx] : char;
            }).join('');
        }

        function toScriptFont(str) {
            const map = {
                'a': '𝓪', 'b': '𝓫', 'c': '𝓬', 'd': '𝓭', 'e': '𝓮', 'f': '𝓯', 'g': '𝓰', 'h': '𝓱',
                'i': '𝓲', 'j': '𝓳', 'k': '𝓴', 'l': '𝓵', 'm': '𝓶', 'n': '𝓷', 'o': '𝓸', 'p': '𝓹',
                'q': '𝓺', 'r': '𝓻', 's': '𝓼', 't': '𝓽', 'u': '𝓾', 'v': '𝓿', 'w': '𝔀', 'x': '𝔁',
                'y': '𝔂', 'z': '𝔃',
                'A': '𝓐', 'B': '𝓑', 'C': '𝓒', 'D': '𝓓', 'E': '𝓔', 'F': '𝓕', 'G': '𝓖', 'H': '𝓗',
                'I': '𝓘', 'J': '𝓙', 'K': '𝓚', 'L': '𝓛', 'M': '𝓜', 'N': '𝓝', 'O': '𝓞', 'P': '𝓟',
                'Q': '𝓠', 'R': '𝓡', 'S': '𝓢', 'T': '𝓣', 'U': '𝓤', 'V': '𝓥', 'W': '𝓦', 'X': '𝓧',
                'Y': '𝓨', 'Z': '𝓩'
            };
            return str.split('').map(char => map[char] || char).join('');
        }

        const itemsGrid = document.getElementById('itemsGrid');
        const sectionTitle = document.getElementById('sectionTitle');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

            return rawTemplates.map((tpl, index) => ({
                id: 'gen_' + index,
                text: tpl.replace(/\[NAME\]/g, cleanQuery)
            }));
        }

        function renderContent(query = "", isNewQuery = true) {
            const cleanQuery = sanitizeInput(query);

            if (isNewQuery) {
                visibleCount = 5;
                if (cleanQuery === "") {
                    sectionTitle.innerText = "أسماء نقترحها عليك:";
                    currentFullList = defaultItems;
                } else {
                    sectionTitle.innerText = `نتائج وتوليد زخارف لـ: "${escapeHTML(cleanQuery)}"`;
                    currentFullList = generateTemplates(cleanQuery);
                }
            }

            const visibleItems = currentFullList.slice(0, visibleCount);

            itemsGrid.innerHTML = visibleItems.map(item => {
                const isSaved = savedItems.some(s => s.text === item.text);
                const safeText = safeJSONString(item.text);
                
                return `
                    <div class="card">
                        <div class="card-text">${escapeHTML(item.text)}</div>
                        <div class="actions">
                            <button class="action-btn save-btn ${isSaved ? 'saved' : ''}" onclick='toggleSave(${safeText})'>
                                ${isSaved ? '⭐ محفوظة' : '☆ حفظ'}
                            </button>
                            <button class="action-btn" onclick='copyText(this, ${safeText})'>نسخ</button>
                        </div>
                    </div>
                `;
            }).join('');

            loadMoreContainer.style.display = visibleCount < currentFullList.length ? 'block' : 'none';
        }

        loadMoreBtn.addEventListener('click', () => {
            visibleCount += 5;
            renderContent(document.getElementById('searchInput').value, false);
        });

        function copyText(btn, text) {
            const safeText = String(text);
            navigator.clipboard.writeText(safeText).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "تم النسخ ✓";
                btn.style.backgroundColor = "var(--success)";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                }, 1500);
            }).catch(() => {
                // طريقة بديلة آمنة
                const textarea = document.createElement('textarea');
                textarea.value = safeText;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    btn.innerText = "تم النسخ ✓";
                } catch (err) {
                    btn.innerText = "فشل النسخ";
                }
                document.body.removeChild(textarea);
            });
        }

        function toggleSave(text) {
            const safeText = String(text).substring(0, 200);
            const existingIndex = savedItems.findIndex(s => s.text === safeText);
            
            if (existingIndex > -1) {
                savedItems.splice(existingIndex, 1);
            } else {
                savedItems.push({
                    id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9),
                    text: safeText
                });
            }
            
            try {
                localStorage.setItem('nibra_saved', JSON.stringify(savedItems));
            } catch (e) {
                // في حال امتلاء التخزين
            }
            
            renderContent(document.getElementById('searchInput').value, false);
            renderSavedDrawer();
        }

        const menuBtn = document.getElementById('menuBtn');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const closeDrawer = document.getElementById('closeDrawer');
        const savedItemsContainer = document.getElementById('savedItemsContainer');

        menuBtn.addEventListener('click', () => {
            drawer.classList.add('open');
            drawerOverlay.style.display = 'block';
            renderSavedDrawer();
        });

        function closeDrawerFunc() {
            drawer.classList.remove('open');
            drawerOverlay.style.display = 'none';
        }

        closeDrawer.addEventListener('click', closeDrawerFunc);
        drawerOverlay.addEventListener('click', closeDrawerFunc);

        function renderSavedDrawer() {
            if (savedItems.length === 0) {
                savedItemsContainer.innerHTML = `<div class="no-results" style="font-size:0.9rem;">لا توجد أسماء محفوظة بعد.</div>`;
                return;
            }
            
            savedItemsContainer.innerHTML = savedItems.map(item => {
                const safeText = safeJSONString(item.text);
                const safeId = escapeHTML(item.id);
                
                return `
                    <div class="saved-item">
                        <span style="font-size: 0.95rem; word-break: break-all;">${escapeHTML(item.text)}</span>
                        <div style="display: flex; gap: 5px;">
                            <button class="action-btn" style="padding: 4px 8px; font-size: 0.8rem;" onclick='copyText(this, ${safeText})'>نسخ</button>
                            <button class="delete-btn" onclick="openDeleteModal('${safeId}')">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

        function openDeleteModal(id) {
            itemToDeleteId = String(id);
            deleteModal.style.display = 'flex';
        }

        cancelDeleteBtn.onclick = () => {
            deleteModal.style.display = 'none';
            itemToDeleteId = null;
        };

        confirmDeleteBtn.addEventListener('click', () => {
            if (itemToDeleteId !== null) {
                savedItems = savedItems.filter(s => s.id !== itemToDeleteId);
                try {
                    localStorage.setItem('nibra_saved', JSON.stringify(savedItems));
                } catch (e) {}
                renderContent(document.getElementById('searchInput').value, false);
                renderSavedDrawer();
            }
            deleteModal.style.display = 'none';
            itemToDeleteId = null;
        });

        const searchInput = document.getElementById('searchInput');

        searchInput.addEventListener('input', (e) => {
            const cleaned = sanitizeInput(e.target.value);
            if (cleaned !== e.target.value) {
                e.target.value = cleaned;
            }
            renderContent(cleaned, true);
        });

        searchInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const cleaned = sanitizeInput(pasted);
            const start = searchInput.selectionStart;
            const end = searchInput.selectionEnd;
            const current = searchInput.value;
            searchInput.value = sanitizeInput(current.substring(0, start) + cleaned + current.substring(end));
            renderContent(searchInput.value, true);
        });

        // منع السحب والإفلات غير المرغوب
        searchInput.addEventListener('drop', (e) => {
            e.preventDefault();
        });

        // تشغيل أولي
        renderContent("", true);
    </script>
</body>
</html>
