<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نِبرا | NIBRA - زخرفة وتوليد الألقاب والبايو</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 25px;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
        }

        .card-text {
            font-size: 1.1rem;
            word-break: break-all;
            flex: 1;
            margin-left: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button.action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.save-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        button.save-btn.saved {
            color: var(--success);
            border-color: var(--success);
        }

        /* القائمة الجانبية (Drawer) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 200;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border);
            z-index: 300;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .close-drawer {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .saved-item {
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .delete-btn:hover {
            background-color: var(--danger-hover);
        }

        /* نافذة تأكيد الحذف */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 400;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        .modal-box p {
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            border: none;
        }

        .btn-confirm {
            background-color: var(--danger);
            color: white;
        }

        .btn-cancel {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .footer-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NIBRA | نِبرا</div>
        <button class="menu-btn" id="menuBtn" aria-label="القائمة الجانبية">☰</button>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="اكتب اسمك (مثال: Vivora) لتوليد ألقاب وزخارف..." maxlength="50">
        
        <div class="section-title" id="sectionTitle">أسماء نقترحها عليك:</div>
        <div class="grid" id="itemsGrid"></div>
    </div>

    <!-- القائمة الجانبية للمفضلة -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h3>الأسماء المحفوظة</h3>
            <button class="close-drawer" id="closeDrawer">&times;</button>
        </div>
        <div class="drawer-body" id="savedItemsContainer"></div>
    </div>

    <!-- نافذة تأكيد الحذف -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <p>هل أنت متأكد من حذف هذا الاسم من قائمة المحفوظات؟</p>
            <div class="modal-actions">
                <button class="modal-btn btn-confirm" id="confirmDeleteBtn">نعم، حذف</button>
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <footer>
        <div>جميع الحقوق محفوظة © نِبرا 2026</div>
        <a href="https://www.instagram.com/9860050jvjchccbxaz?xtok=MXhzMXh3cXVodzVtOQ==" target="_blank" class="footer-link">تابعني على إنستغرام 📸</a>
    </footer>

    <script>
        const defaultItems = [
            { id: 'd1', text: "꧁ঔৣ۝ نِبرا ۝ৣঔ꧂" },
            { id: 'd2', text: "༒☬ VIVORA ☬༒" },
            { id: 'd3', text: "亗 『 الجوكر 』 亗" },
            { id: 'd4', text: "◥☠️💥 KILLER 💥☠️◤" },
            { id: 'd5', text: "⚔️ أسطورة الألعاب ⚔️" },
            { id: 'd6', text: "𓆩⚡️ ملك السرعة ⚡️𓆪" }
        ];

        let savedItems = JSON.parse(localStorage.getItem('nibra_saved')) || [];
        let itemToDeleteId = null;

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        const itemsGrid = document.getElementById('itemsGrid');
        const sectionTitle = document.getElementById('sectionTitle');

        function renderContent(query = "") {
            const cleanQuery = query.trim();
            let displayList = [];

            if (cleanQuery === "") {
                sectionTitle.innerText = "أسماء نقترحها عليك:";
                displayList = defaultItems;
            } else {
                sectionTitle.innerText = `نتائج وتوليد زخارف لـ: "${escapeHTML(cleanQuery)}"`;
                const rawTemplates = [
                    "꧁ঔৣ۝ [NAME] ۝ৣঔ꧂",
                    "༒☬ [NAME] ☬༒",
                    "亗 『 [NAME] 』 亗",
                    "◥☠️💥 [NAME] 💥☠️◤",
                    "⚔️ [NAME] ⚔️",
                    "⦳ ⚡ [NAME] ⚡ ⦳",
                    "𖤍 [NAME] 𖤍",
                    "♛ [NAME] ♛",
                    "ᕦ[NAME]ᕤ",
                    "⚡️[NAME]⚡️",
                    "✿ [NAME] ✿",
                    "☾ [NAME] ☽",
                    "☆彡 [NAME] 彡☆",
                    "❥ [NAME] ❥",
                    "💎 [NAME] 💎",
                    "⚜️ [NAME] ⚜️",
                    "👑 [NAME] 👑",
                    "〆[NAME]〆",
                    "ツ [NAME]",
                    "↱ [NAME] ↰",
                    "◥ ツ [NAME] ツ ◤",
                    "⫷ [NAME] ⫸",
                    "⧼ [NAME] ⧽",
                    "𓆩 [NAME] 𓆪",
                    "𓋼 [NAME] 𓋼",
                    "⚚ [NAME] ⚚",
                    "ꗄ [NAME] ꗄ",
                    "❖ [NAME] ❖",
                    "⌁ [NAME] ⌁",
                    "❃ [NAME] ❃",
                    "彡[NAME]彡",
                    "⁝⁞⁝⁞ [NAME] ⁝⁞⁝⁞",
                    "◤[NAME]◥",
                    "╰☠️╮ [NAME] ╭☠️╯",
                    "╳ [NAME] ╳",
                    "⌖ [NAME] ⌖",
                    "⪻ [NAME] ⪼",
                    "◤☠️ [NAME] ☠️◥",
                    "⚔️『[NAME]』⚔️",
                    "𓆩⚡️[NAME]⚡️𓆪",
                    "⫷★ [NAME] ★⫸",
                    "亗 [NAME] 亗",
                    "ꕥ [NAME] ꕥ",
                    "🫧 [NAME] 🫧",
                    "☁️ [NAME] ☁️",
                    "𓍼 [NAME] 𓍼",
                    "𓏲 [NAME] 𓏲",
                    "♡ [NAME] ♡",
                    "☾『[NAME]』☽",
                    "⚓︎ [NAME] ⚓︎",
                    "⧼💎[NAME]💎⧽",
                    "༺[NAME]༻",
                    "𓆩♡𓆪 [NAME] 𓆩♡𓆪",
                    "𓆩☠️ [NAME] ☠️𓆪",
                    "༺ [NAME] ༻",
                    "╰⚔️╮ [NAME] ╭⚔️╯",
                    "◥▓ [NAME] ▓◤",
                    "⚔️ 𓆩 [NAME] 𓆪 ⚔️",
                    "⁜ [NAME] ⁜",
                    "〆『[NAME]』〆",
                    "𖦹 [NAME] 𖦹",
                    "⪧ [NAME] ⪧",
                    "◥💥 [NAME] 💥◤",
                    "💎『[NAME]』💎",
                    "👑 『[NAME]』 👑",
                    "☆ [NAME] ☆"
                ];

                displayList = rawTemplates.map((tpl, index) => ({
                    id: 'gen_' + index,
                    text: tpl.replace(/[NAME]/g, cleanQuery)
                }));
            }

            itemsGrid.innerHTML = displayList.map(item => {
                const isSaved = savedItems.some(s => s.text === item.text);
                const safeTextJson = JSON.stringify(item.text);
                
                return `
                    <div class="card">
                        <div class="card-text">${escapeHTML(item.text)}</div>
                        <div class="actions">
                            <button class="action-btn save-btn ${isSaved ? 'saved' : ''}" onclick='toggleSave(${safeTextJson})'>
                                ${isSaved ? '⭐ محفوظة' : '☆ حفظ'}
                            </button>
                            <button class="action-btn" onclick='copyText(this, ${safeTextJson})'>نسخ</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "تم النسخ ✓";
                btn.style.backgroundColor = "var(--success)";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "";
                }, 1500);
            });
        }

        function toggleSave(text) {
            const existingIndex = savedItems.findIndex(s => s.text === text);
            if (existingIndex > -1) {
                savedItems.splice(existingIndex, 1);
            } else {
                savedItems.push({ id: 's_' + Date.now() + Math.random(), text: text });
            }

            localStorage.setItem('nibra_saved', JSON.stringify(savedItems));
            renderContent(document.getElementById('searchInput').value);
            renderSavedDrawer();
        }

        const menuBtn = document.getElementById('menuBtn');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const closeDrawer = document.getElementById('closeDrawer');
        const savedItemsContainer = document.getElementById('savedItemsContainer');

        menuBtn.addEventListener('click', () => {
            drawer.classList.add('open');
            drawerOverlay.style.display = 'block';
            renderSavedDrawer();
        });

        function closeDrawerFunc() {
            drawer.classList.remove('open');
            drawerOverlay.style.display = 'none';
        }

        closeDrawer.addEventListener('click', closeDrawerFunc);
        drawerOverlay.addEventListener('click', closeDrawerFunc);

        function renderSavedDrawer() {
            if (savedItems.length === 0) {
                savedItemsContainer.innerHTML = `<div class="no-results" style="font-size:0.9rem;">لا توجد أسماء محفوظة بعد.</div>`;
                return;
            }

            savedItemsContainer.innerHTML = savedItems.map(item => {
                const safeTextJson = JSON.stringify(item.text);
                return `
                    <div class="saved-item">
                        <span style="font-size: 0.95rem; word-break: break-all;">${escapeHTML(item.text)}</span>
                        <div style="display: flex; gap: 5px;">
                            <button class="action-btn" style="padding: 4px 8px; font-size: 0.8rem;" onclick='copyText(this, ${safeTextJson})'>نسخ</button>
                            <button class="delete-btn" onclick="openDeleteModal('${item.id}')">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const deleteModal = document.getElementById('deleteModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

        function openDeleteModal(id) {
            itemToDeleteId = id;
            deleteModal.style.display = 'flex';
        }

        cancelDeleteBtn.onclick = () => {
            deleteModal.style.display = 'none';
            itemToDeleteId = null;
        };

        confirmDeleteBtn.addEventListener('click', () => {
            if (itemToDeleteId !== null) {
                savedItems = savedItems.filter(s => s.id !== itemToDeleteId);
                localStorage.setItem('nibra_saved', JSON.stringify(savedItems));
                renderContent(document.getElementById('searchInput').value);
                renderSavedDrawer();
            }
            deleteModal.style.display = 'none';
            itemToDeleteId = null;
        });

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            let val = e.target.value;
            if (val.length > 50) val = val.substring(0, 50);
            renderContent(val);
        });

        renderContent();
    </script>
</body>
</html>
